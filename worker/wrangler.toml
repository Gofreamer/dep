# JET TCG — servidor (Cloudflare Worker + Durable Object + D1).
#
# Deploy:   npx wrangler deploy --config worker/wrangler.toml
# Dev:      npm run worker:dev   (wrangler dev, http://localhost:8787)
#
# NÃO há segredos neste arquivo. Variáveis de ambiente:
#   CLIENT_ORIGINS      origens permitidas para WebSocket/CORS (separadas por vírgula).
#   JET_RANKED_SECRET   segredo para assinar tickets da Liga Ranqueada
#                       (`npx wrangler secret put JET_RANKED_SECRET` — nunca no repo).
#                       Mínimo 32 caracteres. SEM ele a escrita da Liga devolve
#                       503 (fail-closed): /ranked/start e /ranked/finish ficam
#                       fora do ar, leitura (ladder/perfil/temporada) continua 200,
#                       e o fallback de dev só vale com NODE_ENV=development ou
#                       ALLOW_INSECURE_ORIGIN=1. Não é segredo de exemplo: o
#                       'dev-secret-change-me' da 2.0 estava no repo e qualquer um
#                       podia forjar resultado ranqueado.
#   ALLOW_INSECURE_ORIGIN = "1" só para testes locais.
#
# Banco D1 (Liga Ranqueada) — o binding é adicionado NO DEPLOY, depois de criar
# o banco. Não existe database_id válido antes de `wrangler d1 create`, e
# commitar um id inventado faz o deploy falhar de um jeito confuso; por isso o
# bloco fica comentado aqui e o passo a passo está em `wrangler.example.toml`:
#
#   cp worker/wrangler.example.toml worker/wrangler.local.toml   # (não commitado)
#   npx wrangler d1 create jet-tcg-db                            # imprime o database_id
#   npx wrangler d1 migrations apply jet-tcg-db --local          # 0001 + 0002
#   npx wrangler deploy --config worker/wrangler.local.toml
#
# Sem o binding, o Worker responde 503 em /auth/* e /ranked/* (degradação
# segura) e o multiplayer privado continua funcionando — é o estado em que o
# `wrangler dev` local roda hoje.

name = "jet-tcg-multiplayer"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Origens aceitas para abrir WebSocket (separadas por vírgula).
# `localhost` do Vite já é permitido por padrão no código.
# Use "*" apenas em testes locais — nunca em produção.
[vars]
CLIENT_ORIGINS = "https://dep-7ed.pages.dev,http://localhost:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "JET_ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Cron da escada ranqueada.
#
# `src/ranked/ladderTick.ts` roda a cada hora no minuto 7 (longe do "topo da
# hora", onde todo mundo agenda). Em cada invocação ele:
#   1. resolve a temporada ativa NO BANCO (fora da janela → não joga nada);
#   2. sorteia quantas partidas do lote aquela hora faz (2–8, PRNG da própria
#      hora → reprodutível) e pareia vizinhos de rating no ranking VIVO;
#   3. aplica o resultado pelo MESMO `applyRankedResult` da partida humana
#      (idempotente por matchId determinístico, então reexecutar a hora não
#      pontua duas vezes);
#   4. chama `purgeExpiredSessions` (limpeza de sessões vencidas).
# O tick NÃO é um simulador do MatchEngine: a linha de resultado é amostrada da
# expectativa Elo (documentado no módulo), porque rodar 8 partidas IA×IA por hora
# dentro de um Worker seria hostil à CPU e irreproduzível para o humano que
# assiste ao ladder. O bot×bot de verdade, com engine, é `npm run ranked:sim`.
#
# Sem `[[d1_databases]]` o handler de cron é no-op explícito (nada de erro).
[triggers]
crons = ["7 * * * *"]
